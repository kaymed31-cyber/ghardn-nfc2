    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function downloadVCard() {
            const vcardLines = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:GHARDN PROM;DIRECTION GÉNÉRALE;;;',
                'FN:GHARDN PROM - DIRECTION GÉNÉRALE',
                'ORG:GHARDN PROM Promotion Immobilière',
                'TITLE:Promotion Immobilière & Conseil',
                'TEL;TYPE=CELL,VOICE,WHATSAPP:+213550116622',
                'URL:https://www.ch.ghardnprom.com/',
                'URL;TYPE=MAPS:https://maps.app.goo.gl/MUSit7Mdywx6cBPYA?g_st=aw',
                'END:VCARD'
            ];
            const vcardContent = vcardLines.join('\r\n');
            const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'GHARDN_PROM_Contact.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('Fiche contact téléchargée (GHARDN_PROM_Contact.vcf)');
        }

        function exportCleanIndexHTML() {
            // Clone document so the utility download button is excluded from the published GitHub Pages file
            const clonedDoc = document.documentElement.cloneNode(true);
            const utilityBtn = clonedDoc.querySelector('#github-export-btn');
            if (utilityBtn) {
                utilityBtn.remove();
            }
            const cleanHTML = '<!DOCTYPE html>\n' + clonedDoc.outerHTML;
            const blob = new Blob([cleanHTML], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'index.html';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('Fichier index.html propre téléchargé pour GitHub Pages !');
        }
    </script>
